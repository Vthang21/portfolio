<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="amp.css">
    <style>
        body { 
            margin: 0; background: transparent; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; height: 100vh; 
        }

        /* Pivot logic for the needle */
        .meter-needle-pivot {
            transition: transform 1.8s cubic-bezier(0.2, 0.6, 0.3, 1.1);
            transform: rotate(-45deg); /* Starts at 0A */
        }

        /* Power state: Moves to exactly 12A (which is 9 degrees past center) */
        .power-on .meter-needle-pivot {
            transform: rotate(40deg);
        }
    </style>
</head>
<body>

    <div id="amp-unit" class="amp-meter-square">
        <div class="glass-sheen"></div>

        <div class="meter-face">
            <div class="ticks">
                <div class="tick big" style="transform: rotate(-45deg)"></div> <div class="tick small" style="transform: rotate(-36deg)"></div> <div class="tick small" style="transform: rotate(-27deg)"></div> <div class="tick small" style="transform: rotate(-18deg)"></div> <div class="tick small" style="transform: rotate(-9deg)"></div>  <div class="tick big" style="transform: rotate(0deg)"></div>    <div class="tick small" style="transform: rotate(9deg)"></div>   <div class="tick small" style="transform: rotate(18deg)"></div>  <div class="tick small" style="transform: rotate(27deg)"></div>  <div class="tick small" style="transform: rotate(36deg)"></div>  <div class="tick big" style="transform: rotate(45deg)"></div>   </div>

            <div class="scale-labels">
                <span style="left: 8%; bottom: 12%;">0</span>
                <span style="left: 22%; bottom: 28%;">4</span>
                <span style="left: 36%; bottom: 38%;">8</span>
                <span style="left: 56%; bottom: 38%;">12</span>
                <span style="left: 72%; bottom: 28%;">16</span>
                <span style="left: 86%; bottom: 12%;">20</span>
            </div>
            
            <div id="needle" class="meter-needle-pivot"></div>
            <div class="pivot-bolt"></div>
        </div>
        
        <div class="brand">PRO-SERIES</div>
        <div class="ac-symbol">A ~</div>
    </div>

    <script>
        window.addEventListener('message', (event) => {
            const unit = document.getElementById('amp-unit');
            if (event.data === 'POWER_ON') {
                unit.classList.add('power-on');
            } else if (event.data === 'POWER_OFF') {
                unit.classList.remove('power-on');
            }
        });
    </script>
</body>
</html>
