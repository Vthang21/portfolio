<!-- ============================================ -->
<!-- L4 MODULE LOADER                            -->
<!-- Loads line4.html and injects it dynamically -->
<!-- ============================================ -->
<script>
(function() {
    async function loadL4Module() {
        try {
            const response = await fetch('line4.html');
            const html = await response.text();
            
            // Parse the HTML
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            // Get the container content
            const container = doc.querySelector('.l4-wiring-container');
            
            if (container) {
                // Get the injection point
                const injectionPoint = document.getElementById('l4-injection-point');
                
                // Move all child nodes from container to injection point
                while (container.firstChild) {
                    injectionPoint.appendChild(container.firstChild);
                }
                
                console.log('✓ L4 wiring module loaded successfully');
            } else {
                console.error('Could not find .l4-wiring-container in line4.html');
            }
        } catch (error) {
            console.error('Failed to load L4 module:', error);
        }
    }
    
    // Load when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadL4Module);
    } else {
        loadL4Module();
    }
})();
</script>
