<svg xmlns="http://www.w3.org/2000/svg">
  <style>
    .wire-label { 
      font: bold 10px Arial; 
      fill: #333; 
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 2px; /* This creates a white outline so it's readable over lines */
      text-anchor: middle;
    }
  </style>

  <symbol id="panel-wiring" viewBox="0 0 500 900">
      <line x1="11%" y1="19%" x2="11%" y2="41.5%" stroke="#de1010" stroke-width="4" />
      <text x="11%" y="30%" class="wire-label">101</text>
      
      <line x1="15%" y1="45%" x2="38%" y2="45%" stroke="#de1010" stroke-width="4" />
      <text x="26%" y="44%" class="wire-label">102</text>
  </symbol>
</svg>