<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            margin: 0; background: transparent; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; height: 100vh; 
        }

        .gen-case {
            width: 170px; height: 110px;
            background: linear-gradient(145deg, #444, #222);
            border: 3px solid #111;
            border-radius: 8px;
            position: relative;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* Vibration Animation */
        @keyframes rumble {
            0% { transform: translate(0,0); }
            25% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, 0); }
            75% { transform: translate(1px, -1px); }
            100% { transform: translate(0,0); }
        }

        .gen-running {
            animation: rumble 0.1s linear infinite;
            border-color: #555;
        }

        .gen-vents {
            width: 80%; height: 35%;
            background: repeating-linear-gradient(0deg, #000, #000 4px, #1a1a1a 4px, #1a1a1a 8px);
            border: 2px solid #000;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .gen-label {
            color: #ccc; font-family: 'Arial Black', sans-serif;
            font-size: 12px; letter-spacing: 2px;
        }

        .status-led {
            position: absolute; top: 10px; right: 10px;
            width: 10px; height: 10px; border-radius: 50%;
            background: #300; border: 1px solid #000;
            transition: all 0.2s ease;
        }

        .gen-running .status-led {
            background: #f00;
            box-shadow: 0 0 10px #f00;
        }

        /* Rivet details */
        .rivet {
            position: absolute; width: 6px; height: 6px;
            background: #333; border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="genBox" class="gen-case">
        <div class="status-led"></div>
        <div class="gen-vents"></div>
        <div class="gen-label">GENERATOR</div>
        
        <div class="rivet" style="top:5px; left:5px;"></div>
        <div class="rivet" style="top:5px; right:5px;"></div>
        <div class="rivet" style="bottom:5px; left:5px;"></div>
        <div class="rivet" style="bottom:5px; right:5px;"></div>
    </div>

    <script>
        window.addEventListener('message', (event) => {
            const gen = document.getElementById('genBox');
            if (event.data === 'POWER_ON') {
                gen.classList.add('gen-running');
            } else if (event.data === 'POWER_OFF') {
                gen.classList.remove('gen-running');
            }
        });
    </script>
</body>
</html>
