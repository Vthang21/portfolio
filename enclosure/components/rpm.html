<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            margin: 0; background: transparent; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; height: 100vh; 
        }
        .rpm-display {
            background: #111;
            color: #00ff00; /* Digital Green */
            font-family: 'Courier New', monospace;
            padding: 5px 10px;
            border: 2px solid #444;
            border-radius: 4px;
            text-align: right;
            width: 80px;
            box-shadow: inset 0 0 5px #000;
        }
        .unit { font-size: 10px; color: #888; margin-left: 4px; }
    </style>
</head>
<body>
    <div class="rpm-display">
        <span id="value">0000</span><span class="unit">RPM</span>
    </div>

    <script>
        let currentRpm = 0;
        let targetRpm = 0;
        const display = document.getElementById('value');

        window.addEventListener('message', (event) => {
            if (event.data === 'POWER_ON') targetRpm = 1450 + Math.floor(Math.random() * 20);
            else if (event.data === 'POWER_OFF') targetRpm = 0;
        });

        // Smoothly ramp the numbers up or down
        setInterval(() => {
            if (currentRpm < targetRpm) currentRpm += 15;
            if (currentRpm > targetRpm) currentRpm -= 10;
            if (Math.abs(currentRpm - targetRpm) < 15) currentRpm = targetRpm;
            
            display.innerText = Math.floor(currentRpm).toString().padStart(4, '0');
        }, 30);
    </script>
</body>
</html>
